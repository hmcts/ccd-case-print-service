useCSRFProtection: true
security:
  referrerPolicy: origin
  hpkp:
    maxAge: 2592000
    sha256s:
      - TODO
      - Set-proper-SHA256s
idam:
  base_url: http://localhost:5000
  s2s_url: http://localhost:4502
  print_service_key: AAAAAAAAAAAAAAAA
  service_name: ccd_ps
case_data_store_url: http://localhost:4452
case_data_probate_template_url: http://localhost:4104
appInsights:
  enabled: true
  roleName: "ccd-case-print-service"
secrets:
  ccd:
    microservicekey-ccd-ps: AAAAAAAAAAAAAAAA
    AppInsightsInstrumentationKey: "some-key"
    case-print-service-managed-redis-host: localhost
    case-print-service-managed-redis-port: 6379
    case-print-service-managed-redis-primary-access-key:
redis:
  enabled: false
  tlsEnabled: false
guard:
  enumerationCheck:
    enabled: false
    limit: 10
    ttl: 1800
  rateLimit:
    enabled: false
    requestLimit: 10
    windowPeriod: 1800
